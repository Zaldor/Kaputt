<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaputt! — Leaderboard</title>
<style>
:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#101114;color:#f4f4f5;--o:#ff7a1a}*{box-sizing:border-box}body{margin:0;padding:16px;max-width:800px;margin:auto}
.card{background:#191b20;border:1px solid #30333b;border-radius:14px;padding:15px;margin-top:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:.2em 0}h2{margin:0 0 .6em;font-size:18px}.accent{color:var(--o)}.muted{color:#a6abb5;font-size:13px}
.nav{display:flex;gap:8px}.nav a{color:var(--o);text-decoration:none;padding:6px 12px;border:1px solid #444955;border-radius:8px;font-size:13px}.nav a:hover{background:#23262d}.nav a.active{background:var(--o);color:#111;border-color:var(--o)}
.tabs{display:flex;gap:4px;margin-bottom:12px}.tab{padding:8px 16px;border:1px solid #444955;border-radius:8px;background:transparent;color:#a6abb5;cursor:pointer;font-size:13px;font-weight:600}.tab:hover{background:#23262d}.tab.active{background:var(--o);color:#111;border-color:var(--o)}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}th,td{padding:8px 10px;border-bottom:1px solid #30333b;text-align:right}th{text-align:left;color:#a6abb5;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}td:first-child,th:first-child{text-align:left}
.rank{color:#a6abb5;font-weight:600;min-width:28px}.name{font-weight:700;color:#fff}.win-rate{color:var(--o);font-weight:700}
.empty{text-align:center;padding:40px;color:#a6abb5}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:12px}
.badge{background:#121419;border:1px solid #30333b;border-radius:10px;padding:12px;text-align:center}
.badge-icon{font-size:28px;margin-bottom:4px}.badge-label{font-weight:800;font-size:14px;color:var(--o)}.badge-player{font-weight:700;font-size:16px;color:#fff;margin:4px 0}.badge-value{font-size:12px;color:#a6abb5}.badge-desc{font-size:11px;color:#666;margin-top:2px}
</style></head><body>
<header><div><div class="muted">K3-E1 · competitive</div><h1>KAPUTT! <span class="accent">Leaderboard</span></h1></div>
<nav class="nav"><a href="index.html">PLAY</a><a href="sim.html">SIMULATE</a></nav></header>

<div class="card">
<div class="tabs">
  <button class="tab active" data-period="all">All Time</button>
  <button class="tab" data-period="month">This Month</button>
  <button class="tab" data-period="week">This Week</button>
  <button class="tab" data-period="today">Today</button>
</div>
<table><thead><tr><th>#</th><th>Player</th><th>W</th><th>L</th><th>Win%</th><th>Matches</th><th>Avg Turns</th><th>Best</th></tr></thead><tbody id="lb-body"><tr><td colspan="8" class="empty">Loading...</td></tr></tbody></table>
</div>

<div class="card">
<h2>Badges</h2>
<div class="badges" id="badges"><div class="empty">Loading badges...</div></div>
</div>

<script>
const badgeIcons={speed_demon:'⚡',berserker:'⚔️',iron_wall:'🛡️',extreme_master:'💥',kaputt_magnet:'💀',marathon_runner:'🏃',high_scorer:'🏆',veteran:'🎖️',hold_champion:'🔒',undefeated:'👑'};
(async()=>{
  const tb=document.getElementById('lb-body');
  const badgeDiv=document.getElementById('badges');
  const tabs=document.querySelectorAll('.tab');
  let currentPeriod='all';

  async function loadLeaderboard(period){
    tb.innerHTML='<tr><td colspan="8" class="empty">Loading...</td></tr>';
    try{
      const r=await fetch('/api/leaderboard?limit=50&period='+period);
      const d=await r.json();
      if(!d.ok||!d.players.length){tb.innerHTML='<tr><td colspan="8" class="empty">No matches recorded for this period.</td></tr>';return}
      tb.innerHTML=d.players.map((p,i)=>`<tr><td class="rank">${i+1}</td><td class="name">${esc(p.name)}</td><td>${p.wins}</td><td>${p.losses}</td><td class="win-rate">${p.win_rate}%</td><td>${p.matches_played}</td><td>${p.avg_turns||'—'}</td><td>${p.best_score}</td></tr>`).join('');
    }catch(e){tb.innerHTML='<tr><td colspan="8" class="empty">Could not load leaderboard.</td></tr>'}
  }

  async function loadBadges(){
    badgeDiv.innerHTML='<div class="empty">Loading badges...</div>';
    try{
      const r=await fetch('/api/badges');
      const d=await r.json();
      if(!d.ok||!d.badges.length){badgeDiv.innerHTML='<div class="empty">No badges earned yet.</div>';return}
      badgeDiv.innerHTML=d.badges.map(b=>`<div class="badge"><div class="badge-icon">${badgeIcons[b.id]||'🏅'}</div><div class="badge-label">${esc(b.label)}</div><div class="badge-player">${esc(b.player)}</div><div class="badge-value">${esc(b.value)}</div><div class="badge-desc">${esc(b.desc)}</div></div>`).join('');
    }catch(e){badgeDiv.innerHTML='<div class="empty">Could not load badges.</div>'}
  }

  tabs.forEach(tab=>{tab.addEventListener('click',()=>{tabs.forEach(t=>t.classList.remove('active'));tab.classList.add('active');currentPeriod=tab.dataset.period;loadLeaderboard(currentPeriod)})});
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  loadLeaderboard('all');loadBadges();
})();
</script></body></html>
