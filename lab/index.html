<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaputt! 3.0 Vs Lab — K3-E1</title>
<style>
:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#101114;color:#f4f4f5;--o:#ff7a1a}*{box-sizing:border-box}body{margin:0;padding:16px;max-width:1050px;margin:auto}header,.row,.grid,.actions,.dice,.stats{display:flex;gap:12px;flex-wrap:wrap}.card{background:#191b20;border:1px solid #30333b;border-radius:14px;padding:15px}header{justify-content:space-between;align-items:center}.grid{margin-top:12px}.grid>.card{flex:1 1 300px}.die{width:88px;height:88px;border-radius:16px;background:#f4f4f5;color:#111;display:grid;place-items:center;font-size:42px;font-weight:800;transform-origin:center;will-change:transform}.die.rolling{animation:diceRoll .55s cubic-bezier(.2,.8,.2,1)}.die.revealing{animation:dieReveal .32s ease-out}.resultbox{margin-top:14px;padding:16px;border:1px solid #444955;border-radius:12px;background:#121419}.resultbox .resultmain{font-size:26px;font-weight:900}.resultbox.kaputt{border-color:#b94b4b}.resultbox.extreme{border-color:var(--o)}@keyframes diceRoll{0%{transform:rotate(0) scale(1)}20%{transform:rotate(90deg) scale(.86)}45%{transform:rotate(-130deg) scale(1.12)}70%{transform:rotate(220deg) scale(.9)}100%{transform:rotate(360deg) scale(1)}}@keyframes dieReveal{0%{transform:rotateY(90deg) scale(.8)}100%{transform:rotateY(0) scale(1)}}.hidden{background:#292c33;color:#8c919d}.accent{color:var(--o)}.muted{color:#a6abb5}.active{outline:2px solid var(--o)}button,input,select{font:inherit;border-radius:10px;border:1px solid #444955;padding:10px 12px;background:#23262d;color:#fff}button{cursor:pointer;min-height:44px}button.primary{background:var(--o);color:#111;border-color:var(--o);font-weight:800}button:disabled{opacity:.4;cursor:not-allowed}label{display:grid;gap:5px;font-size:12px;color:#a6abb5}.big{font-size:28px;font-weight:800}.score{font-size:22px;font-weight:800}.log{max-height:240px;overflow:auto;font-family:ui-monospace,monospace;font-size:11px;white-space:pre-wrap}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:6px;border-bottom:1px solid #30333b;text-align:right}td:first-child,th:first-child{text-align:left}.overlay{padding:28px;text-align:center;border:2px dashed #555;border-radius:14px}.winner{font-size:34px;font-weight:900;color:var(--o)}@media(max-width:560px){body{padding:10px}.die{width:76px;height:76px}.actions button{flex:1 1 45%}}
</style></head><body>
<header><div><div class="muted">K3-E1 · competitive psychology bench</div><h1 style="margin:.2em 0">KAPUTT! <span class="accent">Vs Lab</span></h1></div><div class="actions"><select id="mode"><option value="human">Human vs Human</option><option value="random">Human vs Bot · Random</option><option value="aggressive">Human vs Bot · Aggressive</option><option value="safe">Human vs Bot · Safe</option><option value="ev">Human vs Bot · EV Score</option><option value="state">Human vs Bot · State-aware</option></select><button id="reset">New match</button></div></header>
<div class="grid"><section class="card"><div class="stats"><label>Shared NtB<input id="ntb" type="number" min="0" max="99" value="1"></label><label>Win score<input id="target" type="number" min="1" value="100"></label><label>Lose at Kaputt<input id="klimit" type="number" min="1" value="5"></label><label>View<select id="view"><option value="play">PLAY</option><option value="lab">LAB</option></select></label></div></section>
<section class="card"><div class="row"><div id="p0" style="flex:1"><div class="muted">PLAYER 1</div><div class="score"><span id="s0">0</span> pts · <span id="k0">0</span> K</div></div><div id="p1" style="flex:1"><div class="muted" id="p1name">PLAYER 2</div><div class="score"><span id="s1">0</span> pts · <span id="k1">0</span> K</div></div></div></section></div>
<div id="pass" class="card overlay" style="margin-top:12px;display:none"><div class="big">Pass the device</div><p class="muted" id="passmsg"></p><button class="primary" id="ready">I'm ready</button></div>
<div id="game" class="grid"><section class="card"><div class="muted">Current turn</div><div id="turnwho" class="big">PLAYER 1</div><p class="muted">Roll hidden → reveal one die → commit → reveal second.</p><div class="dice"><div id="d1" class="die hidden">?</div><div id="d2" class="die hidden">?</div></div><div class="actions" style="margin-top:14px"><button class="primary" id="roll">Roll 2d6</button><button id="reveal1" disabled>Reveal first</button><button id="attack" disabled>ATTACK ×</button><button id="defense" disabled>DEFENSE +</button><button id="reveal2" disabled>Reveal second</button><button class="primary" id="continue" style="display:none">Continue →</button></div><p id="status" aria-live="polite">Ready.</p><div id="resultbox" class="resultbox" style="display:none"><div id="resultmain" class="resultmain"></div><div id="resultdetail" class="muted"></div></div><p id="botwhy" class="muted"></p></section>
<section class="card" id="labcard" style="display:none"><div class="muted">Conditional decision matrix</div><div id="decision" class="big">—</div><p id="prob" class="muted"></p><table><tbody id="matrix"></tbody></table></section></div>
<div id="end" class="card overlay" style="margin-top:12px;display:none"><div id="winner" class="winner"></div><p id="winreason"></p><button class="primary" id="rematch">Rematch</button></div>
<div class="grid"><section class="card"><div class="muted">Match telemetry</div><div id="telemetry"></div><button id="export">Export match JSON</button></section><section class="card"><div class="muted">Event log</div><div id="log" class="log">Match started.</div></section></div>
<script>
(()=>{const $=id=>document.getElementById(id),R=()=>1+Math.floor(Math.random()*6);let timer=0,audioCtx=null;function ac(){return audioCtx||(audioCtx=new(window.AudioContext||window.webkitAudioContext)())}function tone(freq,dur=.08,type='sine',gain=.055,delay=0){try{const x=ac(),o=x.createOscillator(),g=x.createGain(),t=x.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(x.destination);o.start(t);o.stop(t+dur)}catch(e){}}function sfx(kind){if(kind==='roll'){for(let i=0;i<6;i++)tone(120+Math.random()*180,.035,'square',.025,i*.045)}else if(kind==='reveal')tone(520,.07,'triangle',.04);else if(kind==='success'){tone(440,.09,'sine',.05);tone(660,.13,'sine',.05,.08)}else if(kind==='kaputt'){tone(170,.16,'sawtooth',.06);tone(95,.25,'square',.05,.1)}else if(kind==='defense'){tone(330,.07,'triangle',.035);tone(420,.1,'triangle',.035,.06)}else if(kind==='extreme'){tone(520,.08,'square',.05);tone(780,.08,'square',.05,.07);tone(1040,.15,'square',.05,.14)}}function anim(id,cls='revealing'){const e=$(id);e.classList.remove(cls);void e.offsetWidth;e.classList.add(cls);setTimeout(()=>e.classList.remove(cls),600)}
let s;function fresh(){return {phase:'idle',dice:[],choice:null,player:0,turns:0,extremes:0,leadChanges:0,lastLeader:-1,players:[{score:0,k:0,a:0,d:0,f:0,dt:[]},{score:0,k:0,a:0,d:0,f:0,dt:[]}],history:[],winner:null,reason:null}}
function ex(a,b){return(a===1&&b===6)||(a===6&&b===1)}
function resolve(c,a,b,n){const e=ex(a,b);if(c==='attack'){const v=e?36:a*b,ok=v>n;return{ex:e,value:v,points:ok?v:0,kaputt:!ok,next:ok?v:n,ok}}const v=e?2:a+b,p=e?1:Math.max(a,b);return{ex:e,value:v,points:p,kaputt:false,next:v,ok:v>n}}
function stats(a,n,c){const o=[];for(let b=1;b<=6;b++)o.push(resolve(c,a,b,n));return{success:o.filter(x=>x.ok).length/6,kaputt:o.filter(x=>x.kaputt).length/6,points:o.reduce((z,x)=>z+x.points,0)/6,next:o.reduce((z,x)=>z+x.next,0)/6,extreme:o.filter(x=>x.ex).length/6}}
const pct=x=>(x*100).toFixed(1)+'%',num=x=>x.toFixed(2),isBot=()=>s.player===1&&$('mode').value!=='human';
function botChoice(){const a=s.dice[0],n=+$('ntb').value,A=stats(a,n,'attack'),D=stats(a,n,'defense'),m=$('mode').value,p=s.players[1],opp=s.players[0],target=+$('target').value,lim=+$('klimit').value;let c='defense',why='';
if(m==='random'){c=Math.random()<.5?'attack':'defense';why='Random 50/50.'}
else if(m==='aggressive'){c=A.success>=1/6?'attack':'defense';why='Aggressive: attacks whenever success is possible.'}
else if(m==='safe'){c=(A.kaputt<=1/6&&A.points>D.points)?'attack':'defense';why='Safe: attacks only at low Kaputt risk with better immediate EV.'}
else if(m==='ev'){c=A.points>D.points?'attack':'defense';why='EV Score: higher expected immediate points.'}
else{let urgency=(p.score<opp.score?2:0)+(opp.score>=target*.8?2:0),danger=p.k>=lim-1?5:0;let ua=A.points-A.kaputt*(8+danger)+A.success*urgency,ud=D.points+(D.next<n?1.5:0);c=ua>ud?'attack':'defense';why='State-aware heuristic: score gap, match point pressure, Kaputt danger and NtB de-escalation.'}return[c,why]}
function log(t){$('log').textContent=t+'\n'+$('log').textContent}
function render(){const bot=$('mode').value!=='human';$('p1name').textContent=bot?'BOT · '+$('mode').selectedOptions[0].text.split('·').pop().trim():'PLAYER 2';for(let i=0;i<2;i++){$('s'+i).textContent=s.players[i].score;$('k'+i).textContent=s.players[i].k;$('p'+i).className=s.player===i&&!s.winner?'active':''}$('turnwho').textContent=s.player===0?'PLAYER 1':(bot?'BOT':'PLAYER 2');$('labcard').style.display=$('view').value==='lab'?'block':'none';
const active=!s.winner&&$('pass').style.display==='none';$('roll').disabled=!active||!(s.phase==='idle'||s.phase==='resolved');$('reveal1').disabled=!active||s.phase!=='rolled'||isBot();$('attack').disabled=!active||s.phase!=='first'||isBot();$('defense').disabled=!active||s.phase!=='first'||isBot();$('reveal2').disabled=!active||s.phase!=='chosen'||isBot();$('continue').style.display=s.phase==='resolved'&&!s.winner?'inline-block':'none';$('d1').textContent=['first','chosen','resolved'].includes(s.phase)?s.dice[0]:'?';$('d1').className='die '+(['first','chosen','resolved'].includes(s.phase)?'':'hidden');$('d2').textContent=s.phase==='resolved'?s.dice[1]:'?';$('d2').className='die '+(s.phase==='resolved'?'':'hidden');$('decision').textContent=s.choice?s.choice.toUpperCase():'—';
$('telemetry').innerHTML='<p>Turns <b>'+s.turns+'</b> · Extremes <b>'+s.extremes+'</b> · Lead changes <b>'+s.leadChanges+'</b><br>P1 A/D '+s.players[0].a+'/'+s.players[0].d+' · P2 A/D '+s.players[1].a+'/'+s.players[1].d+'</p>';
if($('view').value==='lab'&&(s.phase==='first'||s.phase==='chosen')){const n=+$('ntb').value,a=s.dice[0],A=stats(a,n,'attack'),D=stats(a,n,'defense');$('prob').textContent='Visible '+a+' · NtB '+n;$('matrix').innerHTML='<tr><th></th><th>Attack</th><th>Defense</th></tr><tr><td>P(>NtB)</td><td>'+pct(A.success)+'</td><td>'+pct(D.success)+'</td></tr><tr><td>P(Kaputt)</td><td>'+pct(A.kaputt)+'</td><td>0%</td></tr><tr><td>EV points</td><td>'+num(A.points)+'</td><td>'+num(D.points)+'</td></tr><tr><td>EV next NtB</td><td>'+num(A.next)+'</td><td>'+num(D.next)+'</td></tr><tr><td>P(Extreme)</td><td>'+pct(A.extreme)+'</td><td>'+pct(D.extreme)+'</td></tr>'}else $('matrix').innerHTML=''}
function roll(){s.dice=[R(),R()];s.choice=null;s.phase='rolled';$('botwhy').textContent='';$('resultbox').style.display='none';$('status').textContent='Dice rolled and hidden.';sfx('roll');anim('d1','rolling');anim('d2','rolling');render();if(isBot())setTimeout(revealFirst,450)}
function revealFirst(){s.phase='first';timer=performance.now();sfx('reveal');anim('d1');$('status').textContent='First die: '+s.dice[0]+'. Choose Attack or Defense.';render();if(isBot())setTimeout(()=>{let[c,w]=botChoice();choose(c);$('botwhy').textContent=w;setTimeout(resolveTurn,650)},500)}
function choose(c){s.choice=c;s.phase='chosen';s._dt=Math.round(performance.now()-timer);$('status').textContent=(c==='attack'?'Attack':'Defense')+' committed. Reveal second die.';render()}
function resolveTurn(){const before=+$('ntb').value,o=resolve(s.choice,s.dice[0],s.dice[1],before),p=s.players[s.player],pre=s.players.map(x=>({score:x.score,k:x.k}));p.score+=o.points;if(o.kaputt)p.k++;if(s.choice==='attack'){p.a++;if(o.kaputt)p.f++}else p.d++;p.dt.push(s._dt||0);s.turns++;if(o.ex)s.extremes++;$('ntb').value=o.next;let leader=s.players[0].score===s.players[1].score?-1:(s.players[0].score>s.players[1].score?0:1);if(s.lastLeader>=0&&leader>=0&&leader!==s.lastLeader)s.leadChanges++;if(leader>=0)s.lastLeader=leader;const target=+$('target').value,lim=+$('klimit').value;if(p.score>=target){s.winner=s.player;s.reason='score target'}else if(p.k>=lim){s.winner=1-s.player;s.reason='opponent reached Kaputt limit'}s.history.push({turn:s.turns,player:s.player+1,opponent:$('mode').value,ntbBefore:before,dice:[...s.dice],choice:s.choice,decisionMs:s._dt||0,...o,playersBefore:pre,playersAfter:s.players.map(x=>({score:x.score,k:x.k})),winner:s.winner===null?null:s.winner+1,winReason:s.reason});$('status').textContent=(o.ex?'EXTREME · ':'')+(s.choice==='attack'?(o.ok?'Attack success':'KAPUTT!'):'Defense')+' · '+o.value+' · +'+o.points+' · NtB '+o.next;log('#'+s.turns+' P'+(s.player+1)+' '+s.choice+' '+o.value+' +'+o.points+(o.kaputt?' KAPUTT':''));s.phase='resolved';render();anim('d2');$('resultbox').style.display='block';$('resultbox').className='resultbox '+(o.kaputt?'kaputt':(o.ex?'extreme':''));$('resultmain').textContent=o.kaputt?'KAPUTT!':(o.ex?'EXTREME · '+o.value:(s.choice==='attack'?'ATTACK · '+o.value:'DEFENSE · '+o.value));$('resultdetail').textContent=(o.kaputt?'No points':('+'+o.points+' points'))+' · NtB '+o.next+(o.ex?' · Extreme resolved':'');sfx(o.ex?'extreme':(o.kaputt?'kaputt':(s.choice==='attack'?'success':'defense')));if(s.winner!==null){$('end').style.display='block';$('winner').textContent='PLAYER '+(s.winner+1)+' WINS';$('winreason').textContent=s.reason+' · '+s.turns+' turns';render();return}}
function nextTurn(){if(s.phase!=='resolved'||s.winner!==null)return;$('resultbox').style.display='none';s.player=1-s.player;s.phase='idle';s.dice=[];s.choice=null;if($('mode').value==='human'){$('game').style.display='none';$('pass').style.display='block';$('passmsg').textContent='Next: PLAYER '+(s.player+1)+'. Previous hidden information is cleared.'}else if(isBot()){render();setTimeout(roll,500)}else render()}
function reset(){s=fresh();$('ntb').value=1;$('s0').textContent=$('s1').textContent=0;$('log').textContent='Match started.';$('status').textContent='Ready.';$('resultbox').style.display='none';$('end').style.display='none';$('pass').style.display='none';$('game').style.display='flex';render()}
$('roll').addEventListener('click',roll);$('reveal1').addEventListener('click',revealFirst);$('attack').addEventListener('click',()=>choose('attack'));$('defense').addEventListener('click',()=>choose('defense'));$('reveal2').addEventListener('click',resolveTurn);$('continue').addEventListener('click',nextTurn);$('ready').addEventListener('click',()=>{$('pass').style.display='none';$('game').style.display='flex';render()});$('reset').addEventListener('click',reset);$('rematch').addEventListener('click',reset);$('view').addEventListener('change',render);$('mode').addEventListener('change',reset);
$('export').addEventListener('click',()=>{const data=JSON.stringify({build:'K3-E1-VS',setup:{opponent:$('mode').value,winScore:+$('target').value,loseAtKaputt:+$('klimit').value,target:+$('target').value,kaputtLimit:+$('klimit').value},sharedNtB:+$('ntb').value,...s},null,2),b=new Blob([data],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kaputt-k3e1-vs.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});reset()})();
</script></body></html>
